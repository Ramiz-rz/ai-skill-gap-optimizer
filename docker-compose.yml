version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: skill-gap-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  python-service:
    build: ./python-service
    container_name: skill-gap-python
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  server:
    build: ./server
    container_name: skill-gap-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/skill-gap-optimizer
      - PYTHON_SERVICE_URL=http://python-service:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o-mini
    depends_on:
      - mongodb
      - python-service

volumes:
  mongo-data:
